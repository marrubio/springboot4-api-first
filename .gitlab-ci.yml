stages:
  - agentic

variables:
  ANALYSIS_DEPTH: "concise"
  POST_COMMENT: "true"
  LLM_API_URL: "https://api.openai.com/v1/chat/completions"
  LLM_MODEL: "gpt-4o-mini"

issue_resolution_plan:
  stage: agentic
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - bash scripts/gitlab/issue-resolution-plan.sh
  rules:
    - when: manual
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - issue-resolution-plan-prompt.md
      - issue-resolution-plan-comment.md